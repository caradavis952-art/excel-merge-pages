<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#88c9d5">
<title>生僻字发音器</title>
<style>
:root{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;color:#18242b;background:#eef8fb}
*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:linear-gradient(145deg,#f7fcfd,#e5f3f8);display:grid;place-items:center;padding:24px}
.app{width:min(620px,100%);background:#f8fcfd;border:1px solid #d6e7ec;border-radius:22px;box-shadow:0 18px 50px #9dbbc833;padding:54px 58px 58px;text-align:center}
h1{font-size:34px;font-weight:500;letter-spacing:.25em;margin:0 0 48px;padding-left:.25em;color:#172329}.title-note-wrap{position:relative;display:inline-block}.title-rare{display:inline-block}.title-note{position:absolute;left:50%;top:-27px;transform:translateX(-50%);display:flex;gap:20px;white-space:nowrap;font:14px/1 Arial,sans-serif;letter-spacing:.04em;color:#1595a8;opacity:0;transition:.25s ease}.title-note span,.title-char{display:inline-block;width:1em;text-align:center;transition:.12s ease}.title-note.show{opacity:1}.title-char.active{color:#0a9ab2;text-shadow:0 0 13px #47c8d855;transform:translateY(-2px) scale(1.12)}.title-rare{display:flex;gap:4px}
.input-wrap{margin:0 auto;width:86%}.input-wrap input{width:100%;height:56px;padding:0 8px;border:0;border-bottom:2px solid #2b9bad;background:transparent;outline:none;text-align:center;font:27px "Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#172329}.input-wrap input:focus{border-bottom-color:#0a9ab2}.input-wrap input::placeholder{font-size:17px;color:#a4bbc1}
.buttons{display:flex;justify-content:center;gap:18px;margin-top:34px}.buttons button{border:1px solid #94ced8;border-radius:9px;background:#88c9d5;color:white;font-size:15px;min-width:118px;height:42px;cursor:pointer;box-shadow:0 3px 7px #6caeb833;transition:.15s}.buttons button:hover{background:#65b9c8;transform:translateY(-1px)}.buttons button:active{transform:translateY(1px);box-shadow:none}.buttons button.secondary{background:#d8eef2;color:#39717d;border-color:#b9dfe5}.buttons button:focus-visible{outline:3px solid #a7dce5;outline-offset:2px}
@media(max-width:520px){body{padding:14px}.app{padding:46px 24px 48px}h1{font-size:28px;margin-bottom:42px}.input-wrap{width:94%}.buttons{gap:12px}}
</style>
</head>
<body>
<section class="app" aria-label="生僻字发音器">
  <main>
    <h1 aria-label="生僻字发音器"><span class="title-note-wrap"><span class="title-note"><span>shēng</span><span>pì</span><span>zì</span></span><span class="title-rare"><span class="title-char">生</span><span class="title-char">僻</span><span class="title-char">字</span></span></span>发音器</h1>
    <div class="input-wrap"><input id="input" type="text" autocomplete="off" placeholder="请输入任意文字……" aria-label="请输入文字"></div>
    <div class="buttons"><button id="read">开始朗读</button><button id="reset" class="secondary">重置</button></div>
    <audio id="voice" preload="auto" src="./sheng-pi-zi.mp3"></audio>
  </main>
</section>
<script>
const input=document.querySelector('#input'),note=document.querySelector('.title-note'),chars=[...document.querySelectorAll('.title-char')],read=document.querySelector('#read'),voice=document.querySelector('#voice');
function clearState(){speechSynthesis.cancel();voice.pause();voice.currentTime=0;note.classList.remove('show');chars.forEach(x=>x.classList.remove('active'));read.disabled=false;read.textContent='开始朗读';input.value='';input.focus()}
function play(){speechSynthesis.cancel();voice.pause();voice.currentTime=0;note.classList.add('show');chars.forEach(x=>x.classList.remove('active'));read.disabled=true;read.textContent='朗读中…';let fallback=false;const u=new SpeechSynthesisUtterance('生僻字');u.lang='zh-CN';u.rate=.82;u.pitch=1.05;u.onend=()=>{if(fallback){read.disabled=false;read.textContent='再读一次'}};voice.ontimeupdate=()=>{const i=Math.min(2,Math.floor(voice.currentTime/.696));chars.forEach((x,n)=>x.classList.toggle('active',n===i))};voice.onended=()=>{chars.forEach(x=>x.classList.remove('active'));read.disabled=false;read.textContent='再读一次'};voice.onerror=()=>{fallback=true;chars.forEach(x=>x.classList.remove('active'));speechSynthesis.speak(u)};voice.play().catch(()=>{fallback=true;speechSynthesis.speak(u)})}
read.addEventListener('click',play);document.querySelector('#reset').addEventListener('click',clearState);input.addEventListener('keydown',e=>{if(e.key==='Enter')play()});window.addEventListener('beforeunload',()=>speechSynthesis.cancel());
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
